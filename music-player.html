<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD book</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;background:transparent;font-family:'Press Start 2P',ui-monospace,Menlo,monospace}
.card{width:min(100%,440px);margin:10px;padding:20px;border-radius:24px;color:#fff;text-shadow:2px 2px 0 #e87aa6;overflow:hidden;
  background:linear-gradient(135deg,#ffe3ee 0%,#ffc2d8 50%,#f9a8c9 100%)}
.lbl{font-size:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book{position:relative;height:250px;perspective:1400px;margin:12px 0 10px}
.page{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.45,.1,.2,1),opacity 0s}
.page.flipped{transform:rotateY(-180deg);opacity:0;transition:transform .85s cubic-bezier(.45,.1,.2,1),opacity 0s .7s}
.front,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 16px 16px 4px;border:3px solid #f6b3cd}
.front{background:#fff8fb;padding:14px 12px 10px 22px;color:#e87aa6;text-shadow:none;display:flex;flex-direction:column;
  box-shadow:inset 16px 0 14px -12px rgba(232,122,166,.5),0 6px 0 rgba(232,122,166,.35)}
.back{background:repeating-linear-gradient(#fff3f8 0 14px,#ffe3ee 14px 15px);transform:rotateY(180deg)}
.ph{font-size:10px;text-align:center;padding-bottom:9px;margin-bottom:8px;border-bottom:2px dashed #f6b3cd}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-content:start}
.grid.none{display:flex;align-items:center;justify-content:center}
.empty{font-size:8px;line-height:1.9;text-align:center}
.cell{text-align:center;padding:7px 2px 5px;border-radius:10px;cursor:pointer}
.cell.sel{background:rgba(255,179,208,.35)}
.cell.sel .cd{transform:scale(1.12)}
.cd{position:relative;width:76px;height:76px;margin:0 auto;border-radius:50%;transition:transform .3s;filter:drop-shadow(0 4px 0 rgba(232,122,166,.35))}
.disc,.cd::after{position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 0 11%,#000 12%);mask:radial-gradient(circle,transparent 0 11%,#000 12%)}
.disc{--h:0deg;animation:spin 3.2s linear infinite;animation-play-state:paused;
  background:conic-gradient(from var(--h),#ffd6e8,#cdb8ff,#fff,#ffe9a8,#b8f0e0,#ffd6e8,#cdb8ff,#fff,#ffd6e8)}
.lab{position:absolute;inset:27%;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#ffb3d0,#cdb8ff) center/cover}
.cd::after{content:'';background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 46%,transparent 57%);pointer-events:none}
.cd.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.ct{font-size:7px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c85a89}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pname{font-size:9px}
.arrow{width:46px;height:40px;padding:0;font-size:14px}
.arrow:disabled{opacity:.4;cursor:default;box-shadow:none}
.info{text-align:center}
.title{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px}
.artist{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.count{font-size:8px}
.rm{font-size:7px;padding:6px 8px;margin-top:8px;box-shadow:0 3px 0 #e87aa6;display:none}
.bar{height:12px;background:#f6b3cd;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 2px #e87aa6;cursor:pointer;margin-top:12px}
.fill{height:100%;width:0;background:#fff}
.time{font-size:8px;text-align:right;margin:6px 0 12px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;font-size:9px;color:#fff;text-shadow:2px 2px 0 #e87aa6;background:#ff9fc3;border:0;border-radius:10px;padding:11px 13px;cursor:pointer;box-shadow:0 4px 0 #e87aa6}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #e87aa6}
button.on{background:#fff;color:#e87aa6;text-shadow:none}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.big{padding:13px 18px;font-size:10px}
.newrow{display:none}.newrow.show{display:flex}
input[type=text]{font:inherit;font-size:8px;padding:10px;border-radius:8px;border:0;width:150px;color:#e87aa6}
.vol{display:flex;align-items:center;gap:10px;justify-content:center;font-size:8px}
input[type=range]{accent-color:#fff;width:120px}
@media (prefers-reduced-motion:reduce){.disc{animation:none}.page,.page.flipped{transition:none}}
</style>
</head>
<body>
<main class="card">
  <div class="lbl" id="state">NOT PLAYING</div>
  <div class="book" id="book"></div>
  <div class="nav">
    <button class="arrow" id="al" aria-label="Previous page">&lt;</button>
    <div class="pname" id="pname"></div>
    <button class="arrow" id="ar" aria-label="Next page">&gt;</button>
  </div>
  <div class="info">
    <div class="title" id="title">EMPTY PAGE</div>
    <div class="artist" id="artist">&nbsp;</div>
    <div class="count" id="count">&nbsp;</div>
    <button class="rm" id="rm">REMOVE SONG</button>
  </div>
  <div class="bar" id="bar" aria-label="Seek"><div class="fill" id="fill"></div></div>
  <div class="time" id="time">0:00 / 0:00</div>
  <div class="row">
    <button id="prev">|&lt;</button>
    <button class="big" id="play">PLAY</button>
    <button id="next">&gt;|</button>
  </div>
  <div class="row">
    <button id="shuf">SHUFFLE</button>
    <button id="loop">LOOP OFF</button>
    <button id="add">ADD FILES</button>
    <button id="addc">ADD COVER</button>
    <button id="newl">NEW LIST</button>
  </div>
  <div class="row newrow" id="newrow"><input type="text" id="lname" maxlength="14" placeholder="LIST NAME" aria-label="Playlist name"><button id="mk">MAKE</button></div>
  <div class="vol">VOL <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
  <input type="file" id="files" accept="audio/*" multiple hidden>
  <input type="file" id="cover" accept="image/*" hidden>
</main>
<script>
/* ADD YOUR SONGS HERE. Upload the mp3 (and cover picture) to this same GitHub repo, then list them:
   {title:"Song name", artist:"Artist", src:"song1.mp3", cover:"song1.jpg"}   (no spaces in file names, cover is optional)
   Each playlist is one page of the book. */
const PLAYLISTS={
  "study":[],
  "chill":[]
};

const $=id=>document.getElementById(id), A=new Audio();
A.volume=.8;
let cur=Object.keys(PLAYLISTS)[0], sel=0, playPl=null, idx=-1, loop=0, shuf=false, covers={}, db=null;
const names=()=>Object.keys(PLAYLISTS), list=()=>PLAYLISTS[cur], pl=()=>PLAYLISTS[playPl]||[];
const key=s=>s.id?'id:'+s.id:'src:'+s.src;
const coverOf=s=>covers[key(s)]||s.cover||'';
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const isPlaying=(p,i)=>p===playPl&&i===idx&&!A.paused;
const stop=()=>{A.pause();A.removeAttribute('src');A.load();idx=-1;playPl=null};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

function build(){
  const b=$('book');b.innerHTML='';
  names().forEach(n=>{
    const pg=mk('div','page'), f=mk('div','front'), g=mk('div','grid');
    f.append(mk('div','ph',n.toUpperCase()));
    const L=PLAYLISTS[n];
    if(!L.length){g.classList.add('none');const e=mk('div','empty');e.innerHTML='NO CDS YET.<br>TAP ADD FILES.';g.append(e)}
    L.forEach((s,i)=>{
      const c=mk('div','cell'), cd=mk('div','cd'), d=mk('div','disc');
      d.style.setProperty('--h',(i*53)%360+'deg');d.append(mk('div','lab'));cd.append(d);
      c.append(cd,mk('div','ct',s.title));
      c.onclick=()=>{if(n===cur){sel=i;toggle(i)}};
      g.append(c);
    });
    f.append(g);pg.append(f,mk('div','back'));b.append(pg);
  });
  flip();refresh();
}
function flip(){
  const ns=names(), pi=ns.indexOf(cur);
  [...$('book').children].forEach((p,i)=>{
    p.classList.toggle('flipped',i<pi);
    p.style.zIndex=i<pi?100+i:ns.length-i;
    p.style.pointerEvents=i===pi?'auto':'none';
  });
  $('al').disabled=pi<=0;$('ar').disabled=pi>=ns.length-1;
}
function refresh(){
  names().forEach((n,pi)=>{
    const pg=$('book').children[pi];if(!pg)return;
    pg.querySelectorAll('.cell').forEach((c,i)=>{
      const s=PLAYLISTS[n][i];if(!s)return;
      const cv=coverOf(s);
      c.querySelector('.lab').style.backgroundImage=cv?'url("'+cv+'")':'';
      c.classList.toggle('sel',n===cur&&i===sel);
      c.querySelector('.cd').classList.toggle('playing',isPlaying(n,i));
    });
  });
}
function info(){
  const s=list()[sel], np=pl()[idx], ns=names();
  $('title').textContent=s?s.title:'EMPTY PAGE';
  $('artist').textContent=s?(s.artist||''):'\u00a0';
  $('count').textContent=s?(sel+1)+' / '+list().length:'\u00a0';
  $('rm').style.display=s&&s.id?'inline-block':'none';
  $('play').textContent=s&&isPlaying(cur,sel)?'PAUSE':'PLAY';
  $('state').textContent=np?(A.paused?'PAUSED: ':'NOW PLAYING: ')+np.title:'NOT PLAYING';
  $('pname').textContent='PAGE '+(ns.indexOf(cur)+1)+'/'+ns.length;
  refresh();
}
function goPage(d){
  const ns=names(), i=Math.max(0,Math.min(ns.length-1,ns.indexOf(cur)+d));
  if(ns[i]===cur)return;
  cur=ns[i];sel=playPl===cur&&idx>=0?idx:0;flip();info();
}
function play(p,i){
  const s=PLAYLISTS[p][i];if(!s)return;
  playPl=p;idx=i;if(p===cur)sel=i;
  A.src=s.src;A.play().catch(()=>{});info();
}
function toggle(i){
  if(!list()[i])return;
  if(cur===playPl&&i===idx){if(A.paused)A.play();else A.pause()}else play(cur,i);
}
function next(auto){
  const L=pl().length;
  if(!L){if(!auto&&list().length)play(cur,0);return}
  let i;
  if(shuf&&L>1){do{i=Math.floor(Math.random()*L)}while(i===idx)}
  else{i=idx+1;if(i>=L){if(auto&&loop!==1){A.pause();A.currentTime=0;info();return}i=0}}
  play(playPl,i);
}
function prev(){
  const L=pl().length;
  if(!L){if(list().length)play(cur,0);return}
  if(A.currentTime>3){A.currentTime=0;return}
  play(playPl,(idx-1+L)%L);
}
$('al').onclick=()=>goPage(-1);
$('ar').onclick=()=>goPage(1);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')goPage(-1);
  if(e.key==='ArrowRight')goPage(1);
});
$('play').onclick=()=>toggle(sel);
$('next').onclick=()=>next(false);
$('prev').onclick=prev;
$('shuf').onclick=e=>{shuf=!shuf;e.target.classList.toggle('on',shuf)};
$('loop').onclick=e=>{
  loop=(loop+1)%3;
  e.target.textContent=['LOOP OFF','LOOP ALL','LOOP ONE'][loop];
  e.target.classList.toggle('on',loop>0);
};
$('add').onclick=()=>$('files').click();
$('files').onchange=e=>{
  const fs=[...e.target.files];if(!fs.length)return;
  const first=list().length;
  fs.forEach(f=>{
    const t=f.name.replace(/\.[^.]+$/,''), id=Date.now()+Math.random();
    list().push({id,title:t,artist:'saved on this device',src:URL.createObjectURL(f)});
    dbPut({id,pl:cur,title:t,artist:'saved on this device',blob:f});
  });
  e.target.value='';build();play(cur,first);
};
$('addc').onclick=()=>{if(list()[sel])$('cover').click()};
$('cover').onchange=e=>{
  const f=e.target.files[0], s=list()[sel];e.target.value='';
  if(!f||!s)return;
  const img=new Image(), u=URL.createObjectURL(f);
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=160;
    const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,160,160);
    const d=c.toDataURL('image/jpeg',.85);
    covers[key(s)]=d;dbPutCover(key(s),d);URL.revokeObjectURL(u);refresh();
  };
  img.src=u;
};
$('rm').onclick=()=>{
  const s=list()[sel];if(!s||!s.id)return;
  dbDel(s.id);dbDelCover(key(s));delete covers[key(s)];
  if(cur===playPl){if(sel===idx)stop();else if(sel<idx)idx--}
  list().splice(sel,1);sel=Math.max(0,Math.min(sel,list().length-1));
  build();info();
};
$('vol').oninput=e=>{A.volume=e.target.value/100};
$('bar').onclick=e=>{
  if(!isFinite(A.duration))return;
  const r=$('bar').getBoundingClientRect();
  A.currentTime=A.duration*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
};
A.ontimeupdate=()=>{
  $('fill').style.width=(isFinite(A.duration)?A.currentTime/A.duration*100:0)+'%';
  $('time').textContent=fmt(A.currentTime)+' / '+fmt(A.duration);
};
A.onplay=A.onpause=info;
A.onended=()=>{if(loop===2){A.currentTime=0;A.play()}else next(true)};
A.onerror=()=>{if(A.getAttribute('src'))$('title').textContent="CAN'T LOAD THIS FILE"};

/* Songs, covers and playlists are saved in this browser, so they survive reloads. */
function dbOpen(){return new Promise(res=>{try{
  const r=indexedDB.open('pixelplayer',2);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id'});
    if(!d.objectStoreNames.contains('covers'))d.createObjectStore('covers',{keyPath:'key'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);
}catch(e){res(null)}})}
const dbStore=(n,m)=>db.transaction(n,m).objectStore(n);
function dbPut(o){if(db)try{dbStore('songs','readwrite').put(o)}catch(e){}}
function dbDel(id){if(db)try{dbStore('songs','readwrite').delete(id)}catch(e){}}
function dbPutCover(k,d){if(db)try{dbStore('covers','readwrite').put({key:k,data:d})}catch(e){}}
function dbDelCover(k){if(db)try{dbStore('covers','readwrite').delete(k)}catch(e){}}
function dbAll(n){return new Promise(res=>{if(!db)return res([]);try{const r=dbStore(n).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>res([])}catch(e){res([])}})}
function saveLists(){try{localStorage.setItem('pp_lists',JSON.stringify(names()))}catch(e){}}
$('newl').onclick=()=>{$('newrow').classList.toggle('show');$('lname').focus()};
$('mk').onclick=()=>{
  const n=$('lname').value.trim().toLowerCase();
  if(!n||PLAYLISTS[n])return;
  PLAYLISTS[n]=[];cur=n;sel=0;
  $('lname').value='';$('newrow').classList.remove('show');
  saveLists();build();info();
};
(async()=>{
  try{(JSON.parse(localStorage.getItem('pp_lists'))||[]).forEach(n=>{if(!PLAYLISTS[n])PLAYLISTS[n]=[]})}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  db=await dbOpen();
  (await dbAll('songs')).forEach(o=>{
    if(!PLAYLISTS[o.pl])PLAYLISTS[o.pl]=[];
    PLAYLISTS[o.pl].push({id:o.id,title:o.title,artist:o.artist,src:URL.createObjectURL(o.blob)});
  });
  (await dbAll('covers')).forEach(o=>{covers[o.key]=o.data});
  build();info();
})();
</script>
</body>
</html>
